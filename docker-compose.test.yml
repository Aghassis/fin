services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LLM_MOCK=true
      - MASSIVE_API_KEY=
      - DB_PATH=/tmp/test.db
    ports:
      - "8000:8000"
    healthcheck:
      # The image is python:3.12-slim + uv and has no curl, so probe with the
      # stdlib instead of adding a package layer. urlopen raises on any non-2xx,
      # matching `curl -f`. 127.0.0.1 rather than localhost: the server falls
      # back to an IPv4-only socket on kernels without IPv6 (see app/server.py).
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health").read()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-jammy
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8000
      # Keep traces and error contexts out of the bind-mounted source tree.
      - PLAYWRIGHT_OUTPUT_DIR=/tmp/test-results
      - HOME=/tmp
    working_dir: /work
    volumes:
      - ./test:/work
      # Anonymous volume so `npm ci` writes node_modules inside the container
      # instead of leaving a root-owned tree in the host's test/ directory.
      - /work/node_modules
    # playwright.config.ts imports @playwright/test, so the dep must exist in
    # /work before the config loads — bare `npx playwright test` fetches only
    # the CLI into npx's cache and dies with MODULE_NOT_FOUND. `npm ci` installs
    # from test/package-lock.json, which pins 1.52.0 to match the browsers baked
    # into this image (bumping one means bumping the other).
    command: sh -c "npm ci && npx playwright test"
