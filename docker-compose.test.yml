services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LLM_MOCK=true
      - MASSIVE_API_KEY=
      - DB_PATH=/tmp/test.db
    ports:
      - "8000:8000"
    healthcheck:
      # The image is python:3.12-slim + uv and has no curl, so probe with the
      # stdlib instead of adding a package layer. urlopen raises on any non-2xx,
      # matching `curl -f`. 127.0.0.1 rather than localhost: the server falls
      # back to an IPv4-only socket on kernels without IPv6 (see app/server.py).
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health").read()
      interval: 5s
      timeout: 3s
      retries: 10

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-jammy
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8000
    working_dir: /work
    volumes:
      - ./test:/work
    command: npx playwright test
